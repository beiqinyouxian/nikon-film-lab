[package]
name = "film_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Core image processing pipeline for Nikon Film Lab (Rust)"

[features]
# Enable NEF (RAW) loading via rawloader when available
nef = ["dep:rawloader"]

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
image = { workspace = true }
imageproc = { workspace = true }
ndarray = { workspace = true }
rayon = { workspace = true }
rand = { workspace = true }
rand_distr = "0.4"
palette = { workspace = true }
fast_image_resize = { workspace = true }
once_cell = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rawloader = { version = "0.37", optional = true }

[dev-dependencies]
tempfile = "3.10"
approx = "0.5"
