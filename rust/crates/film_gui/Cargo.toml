[package]
name = "film_gui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "egui/eframe GUI for Nikon Film Lab (Rust)"

[dependencies]
anyhow = { workspace = true }
eframe = { version = "0.27", features = ["wgpu"] }
egui = "0.27"
egui_extras = { version = "0.27", features = ["image"] }
image = { workspace = true }
rayon = { workspace = true }
once_cell = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
rfd = "0.14"
serde = { workspace = true }
serde_json = { workspace = true }
film_core = { path = "../film_core" }

[features]
default = ["nef"]
nef = ["film_core/nef"]

[[bin]]
name = "nikon-film-lab-rs"
path = "src/main.rs"
