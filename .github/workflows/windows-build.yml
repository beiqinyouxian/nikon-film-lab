name: Windows Build (PyInstaller)

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/nikon-film-desktop-77f3

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Show environment
        run: |
          python --version
          pip list

      - name: Build (onedir)
        run: |
          pyinstaller --noconfirm --clean packaging/NikonFilmLab.spec

      - name: Prepare artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = "dist/NikonFilmLab"
          if (!(Test-Path $outDir)) { throw "Output dir not found: $outDir" }
          Compress-Archive -Path "$outDir/*" -DestinationPath "NikonFilmLab-windows-onedir.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NikonFilmLab-windows-onedir
          path: NikonFilmLab-windows-onedir.zip
          if-no-files-found: error

